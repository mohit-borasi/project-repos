name: workflow

on:
  push:
    branches: ["main","massive"]

jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: put code in runner machine
        uses: actions/checkout@v4

      - name: setup node enviroment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install depedency
        run: npm ci

      - name: create build
        run: npm run build

      
          



      