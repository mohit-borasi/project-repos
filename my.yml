name: check_files

on: push

jobs:
   first_preference:
      runs-on: ubuntu-latest
      steps:
        - name: put code in runner machine
          uses: actions/checkout@v4

        - name: check if file exist or not
          run: test -f index.js 

   validate_file:
      runs-on: ubuntu-latest
      needs: [first_preference]
      steps:
        - name: download code
          uses: actions/checkout@v4

        - name: setup node enviroment
          uses: actions/setup-node@v4
          with: 
            node-version: 24

        - name: check code in node
          run: node --check index.js